var screen='home',unit=null,step=0,solved=false,chosen='',wrong='',feedback='',videoLoaded=false,micStream=null,micRecorder=null,recordUrl='',micOn=false,drag=null,runToken=0;

function family(){try{return JSON.parse(localStorage.getItem(DATA_KEY)||'null')}catch(e){return null}}
function activeKid(){var f=family();return f&&Array.isArray(f.kids)&&f.kids.length>0?(f.active===1?1:0):0}
function kidName(){var f=family(),i=activeKid();return f&&f.kids&&f.kids[i]?String(f.kids[i].name||'Bé').slice(0,18):'Bé'}

function finishProgress(){var f=family(),i=activeKid(),id=unit.id;if(f&&f.kids&&f.kids[i]){var k=f.kids[i];k.finished=k.finished||{};if(k.finished[completeKey(id)])return;k.finished[completeKey(id)]=new Date().toISOString();k.stars=(Number(k.stars)||0)+4;k.activity=Array.isArray(k.activity)?k.activity:[];k.activity.push({id:completeKey(id),at:new Date().toISOString(),stars:4,kind:'muzzy-companion'});k.activity=k.activity.slice(-250);try{localStorage.setItem(DATA_KEY,JSON.stringify(f));return}catch(e){}}

function home(){var done=offlineUnits.filter(function(x){return isDone(x.id)}).length;return top()+'<section class="hero"><div class="kicker">Bé Vui Học · 4–6 tuổi</div><h1>Học cùng phim <span>MUZZY</span></h1><div class="illustration" aria-hidden="true"><span>🎬</span><span>🎧</span><span>🎮</span></div><p class="hero-desc">Xem hoạt hình Muzzy từ kênh chính thức, rồi chơi game nghe và nói tiếng Anh cùng các bạn nhỏ!</p><div class="hero-actions"><button class="primary" data-act="film">▶ Xem phim Muzzy tập 1</button><button class="secondary" data-act="start" data-id="hello">🎮 Chơi ngay</button></div><p class="notice">Khu luyện tập độc lập, không phải ứng dụng chính thức của BBC/Muzzy. Trò chơi và hình minh họa được tạo riêng, không sao chép phim.</p></section><div class="info-row"><span>⭐ Đã hoàn thành '+done+'/6 chủ đề</span><span>🎮 24 hoạt động</span></div><h2 class="panel-title">🌟 Bé muốn chơi gì hôm nay?</h2><div class="world-grid">'+offlineUnits.map(function(x,i){return '<button class="world" data-act="start" data-id="'+x.id+'"><span class="emoji">'+x.icon+'</span><strong>'+esc(x.label)+'</strong><small>'+esc(x.vi)+'</small>'+(isDone(x.id)?'<span class="stamp">✓ Đã chơi</span>':'<small>▶ '+(i+1)+'/6</small>')+'</button>'}).join('')+'</div><p class="note">Chọn chủ đề bất kỳ, bấm 🔊 để nghe giọng Anh từ máy. Game dùng được khi không có mạng sau khi tải vào bộ nhớ PWA; phim Muzzy trên YouTube cần Internet. Mỗi bé lưu tiến độ riêng trên máy.</p>'}
function video(){return top()+'<section class="video-card"><div class="kicker">Phim từ kênh YouTube Muzzy</div><h2>🎬 Muzzy in Gondoland – Episode 1</h2>'+(videoLoaded?'<iframe class="video-frame" src="https://www.youtube-nocookie.com/embed/Dtl6z4EPZmE?playsinline=1&rel=0" title="MUZZY in Gondoland - Episode 1 (kênh chính thức)" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>':'<div class="vidicon">📺</div>')+'<p>Đây là tập 1 được đăng bởi kênh Muzzy. Bé xem hoạt hình để nghe tiếng Anh; sau đó trở lại đây để chơi các game luyện tập tự tạo. Phần phát phim sử dụng YouTube, không tải hay lưu bản sao.</p><div class="video-actions">'+(videoLoaded?'<button class="secondary" data-act="stopVideo">⏹ Đóng video</button>':'<button class="primary" data-act="loadVideo">▶ Mở phim tại đây</button>')+'<a class="external" target="_blank" rel="noopener noreferrer" href="'+FILM+'">↗ Mở trên YouTube</a><button class="secondary" data-act="start" data-id="hello">🎮 Chơi sau khi xem</button></div><p class="video-foot">Video yêu cầu Internet và có thể bị hạn chế nhúng tùy YouTube/thiết bị. Khi mở trình phát, YouTube có thể xử lý dữ liệu theo chính sách riêng; phụ huynh nên đồng hành với bé.</p></section>'}
function toolbar(){var bar='<div class="toolbar"><button class="round" data-act="home" aria-label="Về các chủ đề">←</button><div class="progress">';unit.tasks.forEach(function(t,i){bar+='<i class="'+(i<step?'done':i===step?'active':'')+'"></i>'});return bar+'</div><span class="count">'+(step+1)+' / '+unit.tasks.length+'</span></div>'}
function choiceHtml(t){var arr=t.choices;return '<div class="choices">'+arr.map(function(c){var cls=solved&&c[0]===t.answer?' ok':chosen===c[0]?' selected':wrong===c[0]?' retry':'';return '<button class="choice'+cls+'" data-act="'+(t.type==='give'?'pick':'choose')+'" data-id="'+esc(c[0])+'" '+(solved?'disabled':'')+'><span class="visual">'+esc(c[1])+'</span><span class="name">'+esc(c[2])+'</span></button>'}).join('')+'</div>'}
function gameBody(t){if(t.type==='tap')return choiceHtml(t);if(t.type==='give')return choiceHtml(t)+'<button class="drop-area'+(solved?' ok':'')+'" data-act="drop" '+(solved?'disabled':'')+'><span class="friend">'+esc(t.actor)+'</span><span>🎁 Đưa cho bạn</span></button><p class="hint">Kéo thả hoặc chạm món đồ rồi chạm vào bạn.</p>';return '<div class="say-large">'+esc(t.repeat)+'</div><p class="hint">Nghe mẫu rồi nói theo. Bé không bị chấm điểm phát âm.</p><div class="voicebox"><button class="voicebtn'+(micOn?' rec':'')+'" data-act="'+(micOn?'stopRecord':'record')+'">'+(micOn?'⏹ Dừng ghi âm':'🎙 Ghi âm giọng con')+'</button><button class="voicebtn" data-act="said">😊 Con đã nói!</button></div>'+(recordUrl?'<audio class="playback" controls src="'+recordUrl+'" aria-label="Nghe lại giọng của bé"></audio>':'')+'<p class="record-note">Micro là tùy chọn, ba mẹ cần đồng ý. Giọng bé chỉ được giữ tạm trong phiên này, không gửi lên máy chủ.</p>'}
function play(){var t=unit.tasks[step];return top()+toolbar()+'<section class="game"><div class="game-label">🎮 '+esc(unit.vi)+'</div><div class="game-icon" aria-hidden="true">'+esc(t.actor)+'</div><div class="phrase">'+esc(t.line)+'</div><p class="hint">'+esc(t.hint)+'</p><button class="listen" data-act="listen">🔊 Nghe tiếng Anh</button>'+gameBody(t)+'<p class="feedback'+(wrong?' retry':'')+'" role="status">'+esc(feedback)+'</p><div class="actions"><button class="primary" data-act="next" '+(solved?'':'disabled')+'>'+(step===unit.tasks.length-1?'🏆 Hoàn thành!':'Tiếp tục ➜')+'</button></div></section>'}
function reward(){return top()+'<section class="finish"><div class="big">🏆</div><h1>Great job!</h1><p>Con đã hoàn thành chủ đề <strong>'+esc(unit.label)+'</strong>.</p><p>🌟 Nhận 4 sao khi hoàn thành lần đầu. Con có thể chơi lại để nghe và nói tự nhiên nhé!</p><div class="actions"><button class="secondary" data-act="replay">🔁 Chơi lại</button><button class="primary" data-act="home">🏡 Chọn chủ đề khác</button></div></section>'}
function render(){app.innerHTML=screen==='home'?home():screen==='video'?video():screen==='play'?play():reward()}
function speech(phrase){msg('');if(!('speechSynthesis' in window)){msg('Thiết bị chưa có giọng đọc. Ba mẹ có thể cài giọng tiếng Anh trong cài đặt máy.');return}try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(phrase);u.lang='en-US';u.rate=.82;u.pitch=1;var voices=speechSynthesis.getVoices();var v=voices.find(function(v){return /^en[-_]US/i.test(v.lang)})||voices.find(function(v){return /^en[-_]/i.test(v.lang)});if(v)u.voice=v;u.onerror=function(){msg('Chưa phát được tiếng Anh. Kiểm tra giọng đọc/âm lượng trên máy.')};speechSynthesis.speak(u)}catch(e){msg('Trình duyệt chưa phát được tiếng Anh.')}}
function clearMic(){runToken++;if(micRecorder&&micRecorder.state!=='inactive')try{micRecorder.onstop=null;micRecorder.stop()}catch(e){}if(micStream){micStream.getTracks().forEach(function(x){x.stop()});micStream=null}micOn=false;if(recordUrl){URL.revokeObjectURL(recordUrl);recordUrl=''}}
function begin(id){var next=offlineUnits.find(function(x){return x.id===id});if(!next)return;clearMic();videoLoaded=false;unit=next;step=0;screen='play';solved=false;chosen='';wrong='';feedback='';render();window.scrollTo(0,0);speech(unit.tasks[0].line)}
function homeNow(){clearMic();videoLoaded=false;screen='home';unit=null;if('speechSynthesis' in window)speechSynthesis.cancel();render();window.scrollTo(0,0)}
function correct(){if(solved)return;solved=true;wrong='';feedback='🌟 Great job! Giỏi lắm!';render();speech('Great job!')}
function answer(id){if(solved)return;var t=unit.tasks[step];if(id===t.answer){correct()}else{wrong=id;feedback='💛 Try again! Con thử lại nhé.';render();speech(t.line)}}
function next(){if(!solved)return;clearMic();if(step<unit.tasks.length-1){step++;solved=false;chosen='';wrong='';feedback='';render();speech(unit.tasks[step].line)}else{finishProgress();screen='reward';render();speech('Hooray! Great job!')}}
async function record(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){msg('Thiết bị không hỗ trợ ghi âm. Con vẫn có thể tập nói nhé.');return}
if(!sessionStorage.getItem('muzzy-mic-ok')){if(!confirm('Phụ huynh đồng ý để bé ghi âm trong phiên này? Âm thanh chỉ lưu tạm trong trình duyệt, không tải lên máy chủ.'))return;sessionStorage.setItem('muzzy-mic-ok','1')}
try{clearMic();var token=runToken;micStream=await navigator.mediaDevices.getUserMedia({audio:true});if(token!==runToken||screen!=='play'){micStream.getTracks().forEach(function(t){t.stop()});micStream=null;return}var chunks=[];micRecorder=new MediaRecorder(micStream);micRecorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};micRecorder.onstop=function(){if(token!==runToken)return;if(!chunks.length)return;if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(new Blob(chunks,{type:micRecorder.mimeType||'audio/webm'}));if(screen==='play')render()};micRecorder.start();micOn=true;render();msg('🎙 Đang ghi âm. Con nói và bấm Dừng nhé.')}catch(e){clearMic();msg('Chưa mở được micro. Bé vẫn có thể nghe và nói theo mà không ghi âm.')}}
function stopRecord(){if(!micOn)return;micOn=false;try{if(micRecorder&&micRecorder.state!=='inactive')micRecorder.stop()}catch(e){}if(micStream){micStream.getTracks().forEach(function(x){x.stop()});micStream=null}render()}
app.addEventListener('click',function(e){var btn=e.target.closest('[data-act]');if(!btn)return;var act=btn.dataset.act,id=btn.dataset.id;
if(act==='start')begin(id);
else if(act==='film'){screen='video';videoLoaded=false;render();window.scrollTo(0,0)}
else if(act==='loadVideo'){videoLoaded=true;render()}
else if(act==='stopVideo'){videoLoaded=false;render()}
else if(act==='home')homeNow();
else if(act==='listen'&&unit)speech(unit.tasks[step].line);
else if(act==='choose')answer(id);
else if(act==='pick'){if(solved)return;chosen=id;wrong='';render();msg('Đã chọn! Con đưa món đồ cho bạn nhé.')}
else if(act==='drop'){if(chosen)answer(chosen);else msg('Chọn một món đồ trước nhé!')}
else if(act==='said')correct();
else if(act==='record')record();
else if(act==='stopRecord')stopRecord();
else if(act==='next')next();
else if(act==='replay'&&unit)begin(unit.id);
});
app.addEventListener('pointerdown',function(e){var btn=e.target.closest('[data-act="pick"]');if(!btn||solved||e.button!==0)return;drag={id:btn.dataset.id,x:e.clientX,y:e.clientY,ghost:null}});
app.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.ghost&&dx*dx+dy*dy>180){var it=unit.tasks[step].choices.find(function(c){return c[0]===drag.id});var g=document.createElement('div');g.className='drag-ghost';g.textContent=it?it[1]:'🎁';document.body.appendChild(g);drag.ghost=g}if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';e.preventDefault()}});
app.addEventListener('pointerup',function(e){if(!drag)return;var d=drag;drag=null;if(!d.ghost)return;d.ghost.remove();var hit=document.elementFromPoint(e.clientX,e.clientY);if(hit&&hit.closest('[data-act="drop"]')){chosen=d.id;answer(d.id)}else{chosen=d.id;render();msg('Đã chọn đồ vật. Con đưa món đồ cho bạn nhé.')}});
app.addEventListener('pointercancel',function(){if(drag&&drag.ghost)drag.ghost.remove();drag=null});
window.addEventListener('pagehide',function(){clearMic();if('speechSynthesis' in window)speechSynthesis.cancel()});
render();
})();
</script>
</body>
</html>
